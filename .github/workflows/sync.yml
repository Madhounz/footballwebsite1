name: Sync data

# Runs the reconciliation pipeline against the configured providers and writes
# to the production database.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   DATABASE_URL            required
#   FOOTBALL_DATA_API_KEY   required
#   API_FOOTBALL_KEY        optional second source
#   ANTHROPIC_API_KEY       optional, enables the AI validator
# Repository variable (same page -> Variables):
#   SYNC_ENABLED = true
on:
  schedule:
    - cron: "*/15 * * * *" # results and live scores
    - cron: "17 4 * * *" # daily: teams and squads too
  workflow_dispatch:
    inputs:
      seed:
        description: "Also fetch teams and squads (tick this on the first run)"
        type: boolean
        default: true
      reset:
        description: "Wipe teams, players and matches first (start over; keeps nothing)"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Sync
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.seed }}" = "true" ]; then ARGS="--seed"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.reset }}" = "true" ]; then ARGS="$ARGS --reset"; fi
          if [ "${{ github.event.schedule }}" = "17 4 * * *" ]; then ARGS="--seed"; fi
          pnpm sync -- $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
