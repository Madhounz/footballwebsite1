name: Sync data

# Runs the reconciliation pipeline against the configured providers and writes
# to the production database.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   DATABASE_URL            required
#   FOOTBALL_DATA_API_KEY   required
#   API_FOOTBALL_KEY        optional second source
#   ANTHROPIC_API_KEY       optional, enables the AI validator
# Repository variables (same page -> Variables):
#   SYNC_ENABLED = true
#   NINETY_API_FOOTBALL_OFF = 1   optional; leaves API-Football uncalled from
#                                 here, the way the same name does on the host.
#                                 Set it in both places or the key is still
#                                 being called from one of them.
on:
  schedule:
    # A backstop for the external cron, not a second pipeline: this one hands
    # straight to /api/sync's own code path. See the Sync step.
    - cron: "*/15 * * * *"
    - cron: "17 4 * * *" # daily: the whole season, and teams and squads too
  workflow_dispatch:
    inputs:
      seed:
        description: "Also fetch teams and squads (tick this on the first run)"
        type: boolean
        default: true
      reset:
        description: "Wipe teams, players and matches first (start over; keeps nothing)"
        type: boolean
        default: false
      catch_up:
        description: "Also complete the timelines of this many older matches (0 = none)"
        type: string
        default: "0"

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations are applied by the Vercel build (scripts/migrate-if-db.mjs).
      # Two migrators competing for Postgres' advisory lock is what made this
      # job fail before, so this one only reads and writes rows.
      - name: Sync
        run: |
          # The 15-minute schedule exists for the hour the external cron is
          # down, so it runs exactly what that cron runs: the same three-day
          # window, the same overlap lock, the same metered detail budget. A
          # full-season pass every quarter of an hour would spend API-Football
          # requests that a match in play needs for its line-up.
          if [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then
            pnpm sync -- --refresh
            exit 0
          fi
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.seed }}" = "true" ]; then ARGS="--seed"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.reset }}" = "true" ]; then ARGS="$ARGS --reset"; fi
          if [ "${{ github.event.schedule }}" = "17 4 * * *" ]; then ARGS="--seed"; fi
          CATCH_UP="${{ github.event.inputs.catch_up }}"
          if [ -n "$CATCH_UP" ] && [ "$CATCH_UP" != "0" ]; then ARGS="$ARGS --catch-up $CATCH_UP"; fi
          pnpm sync -- $ARGS
        env:
          # The refresh reads the competitions and clubs it is about to update
          # from the database, the way the deployed site does.
          DATA_SOURCE: db
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # The host has its own copy of this. A switch set in one place only
          # silences half the traffic, which is the same as not setting it.
          NINETY_API_FOOTBALL_OFF: ${{ vars.NINETY_API_FOOTBALL_OFF }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
