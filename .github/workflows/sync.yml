name: Sync data

# Runs the reconciliation pipeline against the configured providers and writes
# to the production database. Needs repository secrets:
#   DATABASE_URL, FOOTBALL_DATA_API_KEY, API_FOOTBALL_KEY (optional), ANTHROPIC_API_KEY (optional)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "From date (YYYY-MM-DD)"
        required: false
      to:
        description: "To date (YYYY-MM-DD)"
        required: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Sync
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.from }}" ]; then ARGS="$ARGS --from ${{ github.event.inputs.from }}"; fi
          if [ -n "${{ github.event.inputs.to }}" ]; then ARGS="$ARGS --to ${{ github.event.inputs.to }}"; fi
          pnpm sync -- $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
